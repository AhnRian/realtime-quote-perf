global:
  # 부하 테스트 중 변화를 촘촘히 보기 위해 짧게 수집한다
  scrape_interval: 2s

scrape_configs:
  - job_name: next
    metrics_path: /api/metrics
    static_configs:
      # 3000: 호스트에서 pnpm start, 3100~3102: Docker 컨테이너 (B3·B4)
      - targets:
          - host.docker.internal:3000
          - host.docker.internal:3100
          - host.docker.internal:3101
          - host.docker.internal:3102
